name: CI

# Builds Hilal for Linux, macOS and Windows on free GitHub-hosted runners,
# launches each package on its own OS and checks the browser chrome through
# Marionette, then publishes the packages as the rolling "nightly" pre-release.
#
# macOS and Windows are cross-compiled on Linux like Mozilla and Zen do: Linux
# runners are faster and always available, and configure bootstraps the macOS
# SDK and the Windows sysroot from Mozilla's public toolchain index. Only the
# tests run on macOS and Windows runners.

on:
  push:
    branches: [main]
    paths-ignore:
      - "www/**"
      - "android/**"
      - "scripts/android-ota/**"
      - ".github/workflows/android-*.yml"
      - "playstore/**"
      - "docs/**"
      - "media/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets to build"
        type: choice
        options: [all, linux, macos, windows]
        default: all
      reuse_build_run:
        description: "Test the packages of this earlier run ID instead of building"
        required: false
        default: ""
      publish_nightly:
        description: "Publish the packages as the nightly pre-release"
        type: boolean
        default: true
  # release.yml builds releases through this same pipeline.
  workflow_call:
    inputs:
      targets:
        type: string
        default: all
      publish_nightly:
        type: boolean
        default: false

concurrency:
  # github.workflow is the caller's name when called, so a release run does
  # not cancel the main branch CI or the other way around.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      build: ${{ steps.plan.outputs.build }}
      artifacts_run: ${{ steps.plan.outputs.artifacts_run }}
      build_date: ${{ steps.plan.outputs.build_date }}
    steps:
      - id: plan
        run: |
          # One build ID for all platforms, so the update server can compare them.
          echo "build_date=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          t="${{ inputs.targets || 'all' }}"
          if [ "$t" = all ]; then
            echo 'targets=["linux","macos","windows"]' >> "$GITHUB_OUTPUT"
          else
            echo "targets=[\"$t\"]" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.reuse_build_run }}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "artifacts_run=${{ inputs.reuse_build_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "artifacts_run=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      SCCACHE_DIR: /mnt/sccache
      SCCACHE_CACHE_SIZE: 3G
      MOZBUILD_STATE_PATH: /mnt/mozbuild
      HILAL_MAC_TOOLS: /mnt/mac-tools
      MOZ_BUILD_DATE: ${{ needs.plan.outputs.build_date }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/lib/jvm \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy \
            /usr/local/cuda-* /usr/share/miniconda
          sudo apt-get clean
          docker system prune -af >/dev/null 2>&1 || true
          sudo mkdir -p /mnt/sccache /mnt/mozbuild /mnt/mac-tools
          sudo chown -R "$USER" /mnt/sccache /mnt/mozbuild /mnt/mac-tools
          df -h / /mnt

      - uses: actions/checkout@v7

      # mach's taskgraph site does not install on newer Pythons, and without it
      # toolchain bootstrap fails quietly.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libdbus-glib-1-dev libpulse-dev libasound2-dev \
            libx11-xcb-dev libxt-dev nasm msitools

      - name: Add swap
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Cache hil
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            hil/target/
          key: hil-${{ runner.os }}-${{ hashFiles('hil/Cargo.toml', 'hil/Cargo.lock', 'hil/src/**') }}

      - name: Build hil
        run: |
          cargo build --release --manifest-path hil/Cargo.toml
          mkdir -p bin
          cp hil/target/release/hil bin/hil

      - name: Add Rust cross targets
        if: matrix.target != 'linux'
        run: |
          case "${{ matrix.target }}" in
            macos) rustup target add aarch64-apple-darwin ;;
            windows) rustup target add x86_64-pc-windows-msvc ;;
          esac

      - name: Set up Firefox source
        run: ./bin/hil setup

      - name: Apply Hilal patches
        run: ./bin/hil apply --force

      - name: Install sccache
        run: |
          v=0.19.0
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/v$v/sccache-v$v-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp
          sudo install "/tmp/sccache-v$v-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: /mnt/sccache
          key: sccache-${{ matrix.target }}-${{ hashFiles('upstream.lock') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.target }}-${{ hashFiles('upstream.lock') }}-
            sccache-${{ matrix.target }}-

      - name: Fetch macOS packaging tools
        if: matrix.target == 'macos'
        run: |
          cd engine
          ./mach artifact toolchain --from-build linux64-hfsplus linux64-libdmg
          mv hfsplus dmg "$HILAL_MAC_TOOLS/"
          ls -la "$HILAL_MAC_TOOLS"/*

      - name: Build and package
        env:
          SAFEBROWSING_KEY: ${{ secrets.HILAL_SAFEBROWSING_API_KEY }}
        run: |
          if [ -n "$SAFEBROWSING_KEY" ]; then
            (umask 077; printf '%s' "$SAFEBROWSING_KEY" > /mnt/safebrowsing.key)
            export HILAL_SAFEBROWSING_KEY_FILE=/mnt/safebrowsing.key
          else
            echo "::warning::HILAL_SAFEBROWSING_API_KEY is not set, so phishing and malware protection is off in this build."
          fi
          scripts/ci/build.sh ${{ matrix.target }}
          rm -f /mnt/safebrowsing.key

      # Proves on every build that complete updates can be made and signed
      # with the key that matches the updater's certificate. Release builds
      # publish these; nightlies do not. The macOS MAR is made on the macOS
      # runner from the ad-hoc signed bundle instead.
      - name: Create signed update (MAR)
        if: matrix.target != 'macos'
        env:
          MAR_KEY: ${{ secrets.HILAL_MAR_SIGNING_KEY }}
        run: |
          if [ -z "$MAR_KEY" ]; then
            echo "::warning::HILAL_MAR_SIGNING_KEY is not set, so no signed update was made."
            exit 0
          fi
          python3 -m venv /mnt/build-mar
          /mnt/build-mar/bin/pip install -q mar==3.2.1
          (umask 077; printf '%s\n' "$MAR_KEY" > /mnt/mar-key.pem)
          # The MAR carries the Firefox app version: the updater refuses one
          # that is lower than the installed version.
          version="$(sed -n 's/^version=//p' dist/BUILD_INFO)"
          HILAL_MAR_SIGNING_KEY=/mnt/mar-key.pem HILAL_BUILD_MAR=/mnt/build-mar/bin/mar \
            scripts/make-full-update.sh "$version" "dist/hilal-${{ matrix.target }}.complete.mar"
          rm -f /mnt/mar-key.pem

      - name: Compiler cache stats
        if: always()
        run: sccache --show-stats || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: /mnt/sccache
          key: sccache-${{ matrix.target }}-${{ hashFiles('upstream.lock') }}-${{ github.run_id }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  test-linux:
    needs: [plan, build]
    if: >-
      always() && !cancelled() && contains(needs.plan.outputs.targets, 'linux') &&
      (needs.plan.outputs.build == 'false' || needs.build.result == 'success' || needs.build.result == 'failure')
    name: test (linux ${{ matrix.session }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        session: [x11, wayland]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: package-linux
          path: package
          run-id: ${{ needs.plan.outputs.artifacts_run }}
          github-token: ${{ github.token }}

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxtst6 \
            xvfb weston fonts-dejavu-core fonts-noto-color-emoji dbus-x11 \
            mesa-utils libgl1-mesa-dri

      - name: Unpack
        run: |
          mkdir app
          tar -xf package/*.linux-*.tar.* -C app
          ls app/*

      - name: UI smoke (X11)
        if: matrix.session == 'x11'
        run: |
          # Draw our own titlebar, as on GNOME and KDE desktops, so the window
          # buttons are tested.
          dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" \
            python3 scripts/ci/ui-smoke.py --binary app/firefox/firefox \
              --pref browser.tabs.inTitlebar=1 --out ui-smoke

      - name: UI smoke (Wayland)
        if: matrix.session == 'wayland'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          weston --backend=headless --width=1600 --height=1000 --socket=wayland-hilal --idle-time=0 &
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-hilal" ] && break; sleep 0.2; done
          WAYLAND_DISPLAY=wayland-hilal MOZ_ENABLE_WAYLAND=1 dbus-run-session -- \
            python3 scripts/ci/ui-smoke.py --binary app/firefox/firefox --out ui-smoke

      - name: Summary
        if: always()
        run: cat ui-smoke/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke-linux-${{ matrix.session }}
          path: ui-smoke/
          retention-days: 14

  # Builds the Flatpak from the tested tarball exactly as Flathub would and
  # runs the UI smoke inside the sandbox.
  test-flatpak:
    needs: [plan, build]
    if: >-
      always() && !cancelled() && contains(needs.plan.outputs.targets, 'linux') &&
      (needs.plan.outputs.build == 'false' || needs.build.result == 'success' || needs.build.result == 'failure')
    name: test (flatpak)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: package-linux
          path: package
          run-id: ${{ needs.plan.outputs.artifacts_run }}
          github-token: ${{ github.token }}

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder xvfb dbus-x11 fonts-dejavu-core
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build and install the Flatpak
        run: |
          tarball="$(ls package/*.linux-*.tar.xz | head -n1)"
          python3 scripts/ci/flatpak-test-manifest.py org.gkdevstudio.Hilal.yml "$tarball" . flatpak-test.yml
          flatpak-builder --user --install-deps-from=flathub --install --force-clean \
            --disable-rofiles-fuse flatpak-build flatpak-test.yml

      - name: UI smoke inside the Flatpak
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" \
            python3 scripts/ci/ui-smoke.py --binary scripts/ci/flatpak-run.sh \
              --pref browser.tabs.inTitlebar=1 --expect-updates disabled --out ui-smoke

      - name: Summary
        if: always()
        run: cat ui-smoke/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke-flatpak
          path: ui-smoke/
          retention-days: 14

  test-macos:
    needs: [plan, build]
    if: >-
      always() && !cancelled() && contains(needs.plan.outputs.targets, 'macos') &&
      (needs.plan.outputs.build == 'false' || needs.build.result == 'success' || needs.build.result == 'failure')
    name: test (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: package-macos
          path: package
          run-id: ${{ needs.plan.outputs.artifacts_run }}
          github-token: ${{ github.token }}

      # Without an Apple Developer ID the app can only be ad-hoc signed. The
      # cross build's binaries carry linker signatures, but the bundle needs a
      # proper seal or macOS reports it as damaged.
      - name: Ad-hoc sign and repack
        run: |
          dmg="$(ls package/*.dmg | head -n1)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          mkdir app
          ditto "$(ls -d "$mnt"/*.app | head -n1)" "app/Hilal Browser.app"
          hdiutil detach "$mnt"
          codesign --sign - --force --deep --entitlements scripts/macos-entitlements.plist "app/Hilal Browser.app"
          codesign --verify --deep --strict "app/Hilal Browser.app"
          mkdir -p signed
          hdiutil create -volname "Hilal Browser" -srcfolder "app/Hilal Browser.app" -ov -format UDZO "signed/$(basename "$dmg")"
          cp package/BUILD_INFO signed/ 2>/dev/null || true

      - name: Create signed update (MAR)
        env:
          MAR_KEY: ${{ secrets.HILAL_MAR_SIGNING_KEY }}
        run: |
          if [ -z "$MAR_KEY" ]; then
            echo "::warning::HILAL_MAR_SIGNING_KEY is not set, so no signed update was made."
            exit 0
          fi
          # Firefox's update packaging scripts at the pinned commit; they are
          # plain shell and need no build tree.
          commit="$(sed -n 's/^commit *= *"\(.*\)"/\1/p' upstream.lock)"
          mkdir -p /tmp/update-packaging
          for f in make_full_update.sh common.sh; do
            curl -fsSL "https://raw.githubusercontent.com/mozilla-firefox/firefox/$commit/tools/update-packaging/$f" -o "/tmp/update-packaging/$f"
          done
          chmod +x /tmp/update-packaging/*.sh
          python3 -m venv /tmp/build-mar
          /tmp/build-mar/bin/pip install -q mar==3.2.1
          key="$(mktemp)"
          printf '%s\n' "$MAR_KEY" > "$key"
          version="$(sed -n 's/^version=//p' package/BUILD_INFO)"
          HILAL_UPDATE_ROOT="$PWD/app/Hilal Browser.app" HILAL_UPDATE_PACKAGING_DIR=/tmp/update-packaging \
          HILAL_MAR_SIGNING_KEY="$key" HILAL_BUILD_MAR=/tmp/build-mar/bin/mar \
            scripts/make-full-update.sh "$version" signed/hilal-macos.complete.mar
          rm -f "$key"

      - name: UI smoke
        run: |
          python3 scripts/ci/ui-smoke.py --binary "app/Hilal Browser.app/Contents/MacOS/firefox" --out ui-smoke

      - name: Summary
        if: always()
        run: cat ui-smoke/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke-macos
          path: ui-smoke/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: package-macos-signed
          path: signed/
          retention-days: 14

  test-windows:
    needs: [plan, build]
    if: >-
      always() && !cancelled() && contains(needs.plan.outputs.targets, 'windows') &&
      (needs.plan.outputs.build == 'false' || needs.build.result == 'success' || needs.build.result == 'failure')
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: package-windows
          path: package
          run-id: ${{ needs.plan.outputs.artifacts_run }}
          github-token: ${{ github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Unpack
        shell: pwsh
        run: |
          $zip = Get-ChildItem package/*.win64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath app
          Get-ChildItem app

      - name: UI smoke
        shell: pwsh
        run: python scripts/ci/ui-smoke.py --binary app/firefox/firefox.exe --out ui-smoke

      - name: Summary
        if: always()
        shell: bash
        run: cat ui-smoke/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke-windows
          path: ui-smoke/
          retention-days: 14

  # A rolling pre-release friends and testers can download without a GitHub
  # account. Release checks (`/releases/latest`) skip pre-releases, so the
  # updater never offers it to stable users.
  publish-nightly:
    needs: [plan, build, test-linux, test-macos, test-windows]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.plan.outputs.build == 'true' && (github.event_name == 'push' || inputs.publish_nightly) &&
      (needs.test-linux.result == 'success' || needs.test-macos.result == 'success' || needs.test-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect tested packages
        env:
          LINUX_OK: ${{ needs.test-linux.result == 'success' }}
          MACOS_OK: ${{ needs.test-macos.result == 'success' }}
          WINDOWS_OK: ${{ needs.test-windows.result == 'success' }}
        run: |
          mkdir -p out
          if [ "$LINUX_OK" = true ]; then
            cp artifacts/package-linux/*.linux-*.tar.* out/Hilal-nightly-linux-x86_64.tar.xz
          fi
          if [ "$MACOS_OK" = true ]; then
            cp artifacts/package-macos-signed/*.dmg out/Hilal-nightly-macos-arm64.dmg
          fi
          if [ "$WINDOWS_OK" = true ]; then
            cp artifacts/package-windows/*.win64.zip out/Hilal-nightly-win64.zip
            inst="$(ls artifacts/package-windows/*.installer.exe 2>/dev/null | head -n1 || true)"
            [ -n "$inst" ] && cp "$inst" out/Hilal-nightly-win64-setup.exe
          fi
          (cd out && sha256sum * > SHA256SUMS)
          ls -la out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Automatic build of ${GITHUB_SHA::7} from main ($(date -u +%Y-%m-%d)). Not a release: use it to test the latest changes. Every package here passed the UI smoke test on its own OS."
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --title "Hilal Nightly" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null || true
          gh release edit nightly --prerelease --title "Hilal Nightly" --notes "$notes"
          gh release upload nightly out/* --clobber

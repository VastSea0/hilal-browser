name: Build and Release

# Releases go through the same pipeline as every main push (ci.yml): all
# platforms are built on Linux runners and UI-tested on their own OS. A
# release is published only when every platform passed.
#
# Everything here is free: GitHub-hosted runners, GitHub Releases for hosting,
# and self-made MAR signing keys. macOS builds are ad-hoc signed (no Apple
# Developer ID), Windows builds are unsigned until SignPath signing is set up.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to (re)build, e.g. v0.4.0-alpha.2"
        required: true
        type: string

permissions:
  contents: write
  # ci.yml deletes superseded compiler caches.
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Determine tag
        id: vars
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Check release metadata
        run: |
          node scripts/release-env.mjs --tag "${{ steps.vars.outputs.tag }}" --json > release-env.json
          node scripts/check-release-metadata.mjs \
            --release-version "$(node -p 'require("./release-env.json").version')" \
            --release-tag "${{ steps.vars.outputs.tag }}"

  build:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      targets: all
      publish_nightly: false
    secrets: inherit

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble release assets
        id: assets
        run: |
          set -euo pipefail
          node scripts/release-env.mjs --tag "$TAG" --github-output "$GITHUB_OUTPUT"
          v="${TAG#v}"
          mkdir -p dist
          cp artifacts/package-linux/*.linux-*.tar.xz "dist/Hilal-$v-linux-x86_64.tar.xz"
          cp artifacts/package-macos-signed/*.dmg "dist/Hilal-Browser-$TAG-macOS.dmg"
          cp artifacts/package-windows/*.win64.zip "dist/Hilal-$v-win64.zip"
          # Every package a user can pick must be there; a release without the
          # Windows installer or the AppImage is not shipped.
          cp artifacts/package-windows/*.installer.exe "dist/Hilal-$v-win64-setup.exe"
          cp artifacts/package-appimage/Hilal-x86_64.AppImage "dist/Hilal-$v-x86_64.AppImage"

          mars=()
          for pair in linux:package-linux/hilal-linux macos:package-macos-signed/hilal-macos windows:package-windows/hilal-windows; do
            name="${pair%%:*}"; src="artifacts/${pair#*:}.complete.mar"
            case "$name" in
              linux) platform=linux-x86_64 ;;
              macos) platform=macos-arm64 ;;
              windows) platform=windows-x86_64 ;;
            esac
            if [ -f "$src" ]; then
              dest="hilal-$TAG-$platform.complete.mar"
              cp "$src" "dist/$dest"
              mars+=(--mar "$platform=dist/$dest" --mar-url "$platform=https://github.com/$GH_REPO/releases/download/$TAG/$dest")
            else
              echo "::error::No signed $platform update; is HILAL_MAR_SIGNING_KEY set?"
              exit 1
            fi
          done

          app_version="$(sed -n 's/^version=//p' artifacts/package-linux/BUILD_INFO)"
          build_id="$(sed -n 's/^buildid=//p' artifacts/package-linux/BUILD_INFO)"
          if [ ${#mars[@]} -gt 0 ]; then
            node scripts/generate-update-manifest.mjs \
              --version "$TAG" \
              --display-version "$v" \
              --app-version "$app_version" \
              --build-id "$build_id" \
              --channel hilal-release \
              "${mars[@]}" \
              --output dist/hilal-update-manifest.json
          fi
          ls -la dist

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: dist/hilal-browser-sbom.spdx.json

      - name: Create checksums
        run: |
          set -euo pipefail
          sha256sum dist/* | sed 's#dist/##' > dist/SHA256SUMS
          ls -la dist

      - name: Upload and publish
        run: |
          # Not marked as a pre-release even for alphas: the update server
          # skips pre-releases, which is how the nightly stays out of updates.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Compare with the previous desktop release, not whichever tag
            # (android-ota, mobile-v*) happens to be newest.
            prev="$(gh release list -L 50 --json tagName -q '.[].tagName' | grep -E '^v[0-9]' | grep -vx "$TAG" | head -n1 || true)"
            gh release create "$TAG" --draft --title "Hilal Browser $TAG" \
              --notes-file .github/release-notes-header.md --generate-notes \
              ${prev:+--notes-start-tag "$prev"}
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false

  packaging:
    # Scoop reads bucket/ and Homebrew reads Casks/ from main, so the
    # manifests for the newest release are committed there.
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update package manifests
        run: |
          set -euo pipefail
          latest="$(gh release view --json tagName -q .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "::notice::$TAG is not the latest release ($latest); manifests stay as they are."
            exit 0
          fi
          gh release download "$TAG" -p SHA256SUMS -D "$RUNNER_TEMP"
          node scripts/generate-packaging.mjs --tag "$TAG" --sums "$RUNNER_TEMP/SHA256SUMS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bucket Casks packaging io.github.VastSea0.Hilal.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update package manifests for $TAG"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done
          gh workflow run packaging-test.yml --ref main

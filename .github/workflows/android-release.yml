name: Android Release

# Push a tag like android-v2.0.0 (or android-v2.1.0-beta.1 for a pre-release) to build a
# signed APK and AAB, publish the APK on a GitHub release, and keep the AAB as an artifact
# for Google Play. The website serves the newest release that has an APK.

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. android-v2.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${TAG#android-v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $TAG is not android-vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::Minor and patch must be below 100 for the versionCode scheme"
            exit 1
          fi
          # Pre-releases share the code of their final version, so a final build must be
          # tagged after its betas and replaces them on update.
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          PRERELEASE=false
          [[ -n "${BASH_REMATCH[4]}" ]] && PRERELEASE=true
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Without the real key every release would be signed with a throwaway debug key,
          # and installed apps could not update. Refuse to publish in that case.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (see docs/MOBILE.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/hilal-upload-key.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -Philal.versionName=${{ steps.version.outputs.name }} \
            -Philal.versionCode=${{ steps.version.outputs.code }}

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::Release APK is signed with a debug key"
            exit 1
          fi

      - name: Collect artifacts
        id: files
        run: |
          VERSION=${{ steps.version.outputs.name }}
          APK="hilal-browser-android-$VERSION.apk"
          AAB="hilal-browser-android-$VERSION.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

          NOTES="android/release-notes/$VERSION.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-notes.md
          else
            echo "Hilal Browser for Android $VERSION." > release-notes.md
          fi
          {
            echo
            echo "### Install"
            echo
            echo "Download \`$APK\` below and open it on your phone. SHA-256:"
            echo
            echo '```'
            cut -d' ' -f1 "$APK.sha256"
            echo '```'
          } >> release-notes.md

      - name: Keep the AAB for Google Play
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.files.outputs.aab }}
          path: ${{ steps.files.outputs.aab }}
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Hilal Browser for Android ${{ steps.version.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
          files: |
            ${{ steps.files.outputs.apk }}
            ${{ steps.files.outputs.apk }}.sha256

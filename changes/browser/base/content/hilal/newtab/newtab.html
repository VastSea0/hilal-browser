<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title data-l10n-id="hilal-newtab-title"></title>
    <link
      rel="icon"
      type="image/png"
      href="chrome://branding/content/icon32.png"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/hilal/newtab/newtab.css"
    />
    <link rel="localization" href="browser/browser.ftl" />
  </head>
  <body class="hilal-newtab">
    <main class="hilal-home-container">
      <!-- Brand: Logo & Wordmark -->
      <div class="hilal-brand">
        <img
          src="chrome://branding/content/about-logo.png"
          class="hilal-logo"
          alt=""
        />
        <div class="hilal-wordmark">
          <span class="hilal-wordmark-bold">Hilal</span>
          <span class="hilal-wordmark-light">Browser</span>
        </div>
      </div>

      <!-- Search Bar -->
      <form class="hilal-search-form" id="search-form" autocomplete="off">
        <div class="hilal-search-engine-icon">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7.5" />
            <line x1="21" y1="21" x2="16.5" y2="16.5" />
          </svg>
        </div>
        <input
          type="text"
          id="search-input"
          class="hilal-search-input"
          data-l10n-id="hilal-newtab-search-input"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          type="button"
          class="hilal-search-clear"
          id="search-clear"
          data-l10n-id="hilal-newtab-search-clear"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
        <button
          type="submit"
          class="hilal-search-submit"
          id="search-submit"
          data-l10n-id="hilal-newtab-search-submit"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
      </form>

      <!-- Clean Shortcuts Row -->
      <div class="hilal-shortcuts-row" id="shortcuts-grid">
        <!-- Dynamically rendered shortcuts -->
      </div>
    </main>

    <!-- Add/Edit Shortcut Dialog -->
    <dialog class="hilal-dialog" id="shortcut-dialog">
      <div class="hilal-dialog-card">
        <h2
          class="hilal-dialog-title"
          id="dialog-title"
          data-l10n-id="hilal-newtab-dialog-title"
        ></h2>
        <form id="shortcut-dialog-form">
          <div class="hilal-field-group">
            <label class="hilal-field">
              <span
                class="hilal-label"
                data-l10n-id="hilal-newtab-field-name"
              ></span>
              <input
                type="text"
                id="shortcut-name-input"
                class="hilal-input"
                data-l10n-id="hilal-newtab-field-name-input"
                required
              />
            </label>
            <label class="hilal-field">
              <span
                class="hilal-label"
                data-l10n-id="hilal-newtab-field-url"
              ></span>
              <input
                type="url"
                id="shortcut-url-input"
                class="hilal-input"
                data-l10n-id="hilal-newtab-field-url-input"
                required
              />
            </label>
          </div>
          <div class="hilal-dialog-actions">
            <button
              type="button"
              class="hilal-btn hilal-btn-delete"
              id="dialog-delete-btn"
              data-l10n-id="hilal-newtab-dialog-delete"
              style="display: none"
            ></button>
            <div class="hilal-dialog-spacer"></div>
            <button
              type="button"
              class="hilal-btn hilal-btn-text"
              id="dialog-cancel-btn"
              data-l10n-id="hilal-newtab-dialog-cancel"
            ></button>
            <button
              type="submit"
              class="hilal-btn hilal-btn-primary"
              id="dialog-save-btn"
              data-l10n-id="hilal-newtab-dialog-save"
            ></button>
          </div>
        </form>
      </div>
    </dialog>

    <script src="chrome://browser/content/hilal/newtab/newtab.js"></script>
  </body>
</html>

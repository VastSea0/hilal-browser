    <main class="home">
      <section class="clock" aria-hidden="true">
        <div class="clock-unit clock-hours">
          <span class="hilal-shape clock-shape" data-shape="cookie9"></span>
          <span class="clock-digits" id="clock-hours"></span>
        </div>
        <div class="clock-unit clock-minutes">
          <span class="hilal-shape clock-shape" data-shape="puffy"></span>
          <span class="clock-digits" id="clock-minutes"></span>
        </div>
      </section>
      <p class="clock-date">
        <span id="clock-date"></span>
        <span class="clock-period" id="clock-period"></span>
      </p>

      <form class="search" id="search-form" autocomplete="off">
        <i class="search-icon" aria-hidden="true">search</i>
        <input
          type="text"
          id="search-input"
          class="search-input"
          data-l10n-id="hilal-newtab-search-input"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          type="button"
          class="icon-button search-clear"
          id="search-clear"
          data-l10n-id="hilal-newtab-search-clear"
          hidden
        >
          <i aria-hidden="true">close</i>
        </button>
        <button
          type="submit"
          class="search-submit"
          data-l10n-id="hilal-newtab-search-submit"
        >
          <i aria-hidden="true">arrow_forward</i>
        </button>
      </form>

      <section class="shortcuts" id="shortcuts"></section>

      <nav class="chips">
        <button class="chip" data-url="hilal:bookmarks">
          <i aria-hidden="true">bookmarks</i>
          <span data-l10n-id="hilal-newtab-bookmarks"></span>
        </button>
        <button class="chip" data-url="hilal:history">
          <i aria-hidden="true">history</i>
          <span data-l10n-id="hilal-newtab-history"></span>
        </button>
        <button class="chip" data-url="hilal:downloads">
          <i aria-hidden="true">download</i>
          <span data-l10n-id="hilal-newtab-downloads"></span>
        </button>
        <button class="chip" data-url="hilal:settings">
          <i aria-hidden="true">settings</i>
          <span data-l10n-id="hilal-newtab-settings-chip"></span>
        </button>
      </nav>
    </main>

    <dialog class="dialog" id="shortcut-dialog">
      <form id="shortcut-form" method="dialog">
        <h2 class="dialog-title" id="dialog-title"></h2>
        <label class="field">
          <span data-l10n-id="hilal-newtab-field-name"></span>
          <input
            type="text"
            id="shortcut-name"
            data-l10n-id="hilal-newtab-field-name-input"
            required
          />
        </label>
        <label class="field">
          <span data-l10n-id="hilal-newtab-field-url"></span>
          <input
            type="text"
            id="shortcut-url"
            data-l10n-id="hilal-newtab-field-url-input"
            required
          />
        </label>
        <div class="dialog-actions">
          <button
            type="button"
            class="text-button danger"
            id="dialog-delete"
            data-l10n-id="hilal-newtab-dialog-delete"
            hidden
          ></button>
          <span class="spacer"></span>
          <button
            type="button"
            class="text-button"
            id="dialog-cancel"
            data-l10n-id="hilal-newtab-dialog-cancel"
          ></button>
          <button
            type="submit"
            class="filled-button"
            data-l10n-id="hilal-newtab-dialog-save"
          ></button>
        </div>
      </form>
    </dialog>

    <script src="chrome://browser/content/hilal/newtab/newtab.js"></script>
  </body>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title data-l10n-id="hilal-newtab-title"></title>
    <link
      rel="icon"
      type="image/png"
      href="chrome://branding/content/icon32.png"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/hilal/newtab/newtab.css"
    />
    <link rel="localization" href="browser/browser.ftl" />
  </head>
  <body>
    <main class="home">
      <section class="clock-card" aria-hidden="true">
        <div class="clock" id="clock">
          <span id="clock-hours"></span><span class="clock-sep">:</span
          ><span id="clock-minutes"></span
          ><span class="clock-period" id="clock-period"></span>
        </div>
        <div class="clock-date" id="clock-date"></div>
      </section>

      <form class="search" id="search-form" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <line x1="20.5" y1="20.5" x2="16" y2="16" />
        </svg>
        <input
          type="text"
          id="search-input"
          class="search-input"
          data-l10n-id="hilal-newtab-search-input"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          type="button"
          class="icon-button search-clear"
          id="search-clear"
          data-l10n-id="hilal-newtab-search-clear"
          hidden
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="17" y1="7" x2="7" y2="17" />
            <line x1="7" y1="7" x2="17" y2="17" />
          </svg>
        </button>
        <button
          type="submit"
          class="search-submit"
          data-l10n-id="hilal-newtab-search-submit"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="13 6 19 12 13 18" />
          </svg>
        </button>
      </form>

      <section class="shortcuts" id="shortcuts"></section>

      <nav class="chips">
        <button
          class="chip"
          data-url="about:bookmarks"
          data-l10n-id="hilal-newtab-bookmarks"
        ></button>
        <button
          class="chip"
          data-url="about:history"
          data-l10n-id="hilal-newtab-history"
        ></button>
        <button
          class="chip"
          data-url="about:downloads"
          data-l10n-id="hilal-newtab-downloads"
        ></button>
        <button
          class="chip"
          data-url="about:preferences"
          data-l10n-id="hilal-newtab-settings-chip"
        ></button>
      </nav>
    </main>

    <dialog class="dialog" id="shortcut-dialog">
      <form id="shortcut-form" method="dialog">
        <h2 class="dialog-title" id="dialog-title"></h2>
        <label class="field">
          <span data-l10n-id="hilal-newtab-field-name"></span>
          <input
            type="text"
            id="shortcut-name"
            data-l10n-id="hilal-newtab-field-name-input"
            required
          />
        </label>
        <label class="field">
          <span data-l10n-id="hilal-newtab-field-url"></span>
          <input
            type="text"
            id="shortcut-url"
            data-l10n-id="hilal-newtab-field-url-input"
            required
          />
        </label>
        <div class="dialog-actions">
          <button
            type="button"
            class="text-button danger"
            id="dialog-delete"
            data-l10n-id="hilal-newtab-dialog-delete"
            hidden
          ></button>
          <span class="spacer"></span>
          <button
            type="button"
            class="text-button"
            id="dialog-cancel"
            data-l10n-id="hilal-newtab-dialog-cancel"
          ></button>
          <button
            type="submit"
            class="filled-button"
            data-l10n-id="hilal-newtab-dialog-save"
          ></button>
        </div>
      </form>
    </dialog>

    <script src="chrome://browser/content/hilal/newtab/newtab.js"></script>
  </body>
</html>

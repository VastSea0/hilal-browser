<!DOCTYPE window>

<window
  xmlns:html="http://www.w3.org/1999/xhtml"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  id="hilalBoostShareDialog">
  <dialog
    class="hbs-dialog"
    buttons="accept,cancel"
    data-l10n-id="hilal-boost-share-dialog"
    data-l10n-attrs="buttonlabelaccept,buttonlabelcancel">
    <linkset>
      <html:link rel="stylesheet" href="chrome://global/skin/global.css" />
      <html:link rel="stylesheet" href="chrome://browser/content/hilal/boosts/hilal-boosts-share.css" />
      <html:link rel="stylesheet" href="chrome://browser/content/hilal/boosts/hilal-boosts-icons.css" />
      <html:link rel="localization" href="browser/hilal-boosts.ftl" />
    </linkset>
    <script src="chrome://browser/content/hilal/boosts/hilal-boost-share.js"></script>

    <html:div class="hbs-card">
      <html:div class="hbs-success">
        <svg xmlns="http://www.w3.org/2000/svg" class="hbs-success-heart-svg" viewBox="-100 -100 904 867">
          <path d="M351.968 105.408c.003 5.521.03 5.512.032 0C405.811-9.623 565.654-4.242 637.447 78.552 732.581 167.64 688.13 339.334 627.592 417 489.014 594.786 399.896 636.064 366.608 647.146a46.9 46.9 0 0 1-29.775-.05C303.039 635.722 213.78 593.28 76.377 417c-60.538-77.665-104.99-249.361-9.856-338.448C138.315-4.24 298.157-9.623 351.968 105.408"/>
        </svg>
        <html:div class="hbs-success-heart-container">
          <html:div class="hbs-success-heart">
            <html:img src="chrome://browser/content/hilal/boosts/boost-share-heart.png" draggable="false" />
            <svg xmlns="http://www.w3.org/2000/svg" class="hbs-success-heart-check" viewBox="0 0 24 24" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
              <path d="M20 5 10 17l-4-4"/>
            </svg>
          </html:div>
        </html:div>
        <html:p class="hbs-success-copied" data-l10n-id="hilal-boost-shared-animation-copied-link"></html:p>
      </html:div>

      <html:div class="hbs-top">
        <html:div class="hbs-info">
          <html:img class="hbs-favicon" draggable="false" />
          <html:div class="hbs-info-text">
            <html:input class="hbs-name dashed" type="text" noinitialfocus="true" data-l10n-id="hilal-boost-share-name-input" />
            <html:div class="hbs-author">
              <html:i data-l10n-id="hilal-boost-share-shared-by"></html:i>
              <html:input class="hbs-author-name" type="text" noinitialfocus="true" data-l10n-id="hilal-boost-share-author-input" />
            </html:div>
          </html:div>
          <button class="hbs-info-button" noinitialfocus="true" data-l10n-id="hilal-boost-share-info" />
        </html:div>

        <html:div class="hbs-content">
          <html:div class="hbs-pane">
            <html:div class="hbs-screenshot">
              <html:canvas></html:canvas>
              <html:img class="hbs-screenshot-favicon" draggable="false" />
            </html:div>
            <html:div class="hbs-signature-pane">
              <html:p data-l10n-id="hilal-boost-share-scribble-text"></html:p>
              <svg xmlns="http://www.w3.org/2000/svg" class="hbs-signature"></svg>
            </html:div>
          </html:div>
        </html:div>
        <html:div class="hbs-pane-buttons-container">
          <html:div class="hbs-pane-buttons">
            <button class="hbs-pane-left" noinitialfocus="true" />
            <html:div class="hbs-vertical-sep"></html:div>
            <button class="hbs-pane-right" noinitialfocus="true" />
          </html:div>
        </html:div>
      </html:div>
    </html:div>

    <popupset>
      <menupopup id="hbs-screenshot-menu">
        <menuitem id="hbs-hide-screenshot" type="checkbox" autocheck="false" data-l10n-id="hilal-boost-share-hide-screenshot" />
      </menupopup>
      <panel type="arrow" class="hbs-info-panel" id="hilal-boost-share-info-panel">
        <html:p data-l10n-id="hilal-boost-share-info-text"></html:p>
      </panel>
    </popupset>
  </dialog>
</window>

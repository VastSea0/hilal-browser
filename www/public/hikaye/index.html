<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hilal'in Hikâyesi</title>
<meta name="description" content="İnternet bir zamanlar herkesindi. Hilal Tarayıcı'nın kısa hikâyesi.">
<style>
  :root {
    --bg: #04070f;
    --fg: #f0ece2;
    --hilal: #b1d9f2;
    --muted: rgba(240, 236, 226, 0.65);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; overflow: hidden; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; align-content: center;
    gap: 20px; background: #04070f; border: 0; color: var(--fg); cursor: pointer; font: inherit; }
  #start svg { width: clamp(64px, 9vw, 112px); height: auto; }
  #start .t { font-size: clamp(18px, 2.4vw, 30px); font-weight: 500; letter-spacing: 0.02em; }
  #start .s { font-size: clamp(12px, 1.3vw, 15px); color: var(--muted); }
  #start:hover svg, #start:focus-visible svg { transform: scale(1.04); }
  #start svg { transition: transform 0.2s; }
  #start:focus-visible { outline: 2px solid var(--hilal); outline-offset: -8px; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: linear-gradient(transparent, rgba(0, 0, 0, 0.7)); opacity: 0; transition: opacity 0.3s; }
  #stage:hover #bar, #bar:focus-within, #stage.paused #bar { opacity: 1; }
  #bar button { background: none; border: 0; color: var(--fg); cursor: pointer; padding: 6px; min-width: 32px;
    display: grid; place-items: center; border-radius: 6px; font: inherit; font-size: 13px; letter-spacing: 0.04em; }
  #bar button:hover { background: rgba(255, 255, 255, 0.12); }
  #bar svg { width: 20px; height: 20px; fill: currentColor; }
  #seek { flex: 1; accent-color: var(--hilal); min-width: 0; }
  #time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
  body.export #bar, body.export #start { display: none; }
</style>
<script src="timeline.js"></script>
</head>
<body>
<div id="stage" class="paused">
  <canvas id="c" width="1920" height="1080" aria-label="Hilal'in hikâyesini anlatan animasyon"></canvas>
  <button id="start" aria-label="Animasyonu başlat">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <mask id="cut"><rect width="512" height="512" fill="#fff"/><circle cx="287.4" cy="228.9" r="210" fill="#000"/></mask>
      <circle cx="256" cy="256" r="256" fill="#b1d9f2" mask="url(#cut)"/>
    </svg>
    <span class="t">Hilal'in Hikâyesi</span>
    <span class="s">Sesli izleyin &middot; İngilizce anlatım, Türkçe altyazı</span>
  </button>
  <div id="bar">
    <button id="pp" aria-label="Duraklat"><svg viewBox="0 0 24 24"><path id="ppi" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Zaman">
    <span id="time">0:00</span>
    <button id="cc" aria-label="Altyazı dili">TR</button>
    <button id="fs" aria-label="Tam ekran"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
  </div>
</div>
<audio id="audio" src="story.m4a" preload="auto"></audio>
<script>
"use strict";
const TL = window.TIMELINE;
const C = TL.cues;
const W = 1920, H = 1080;
const cv = document.getElementById("c");
let g = cv.getContext("2d");
const params = new URLSearchParams(location.search);
let lang = params.get("lang") || "tr"; // "tr", "en" or "off"

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const mixc = (a, b, x) => [lerp(a[0], b[0], x), lerp(a[1], b[1], x), lerp(a[2], b[2], x)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const env = (t, a, b, fi = 0.6, fo = 0.6) => seg(t, a, a + fi) * (1 - seg(t, b - fo, b));
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function kf(t, frames) {
  if (t <= frames[0][0]) return frames[0][1];
  for (let i = 1; i < frames.length; i++) {
    const [t1, v1] = frames[i];
    if (t <= t1) {
      const [t0, v0] = frames[i - 1];
      const x = eio(seg(t, t0, t1));
      return Array.isArray(v0) ? mixc(v0, v1, x) : lerp(v0, v1, x);
    }
  }
  return frames[frames.length - 1][1];
}

// ---------- palette ----------
// One family of night blues; Hilal's own pale blue is the light of the story,
// amber belongs to the Fox and red to the Empire.
const HILAL = [177, 217, 242], CREAM = [240, 236, 226], AMBER = [236, 142, 62], RED = [214, 50, 64];
const NIGHT0 = [5, 9, 22], NIGHT1 = [16, 28, 62], NIGHT2 = [34, 52, 104];
const SIL = [6, 9, 18], ASH = [120, 122, 134];
const VCOL = [[124, 212, 196], [172, 164, 236], [140, 196, 240], [240, 186, 142]];
const VALUES = { tr: ["Açıklık", "Gizlilik", "Özgürlük", "Topluluk"], en: ["Openness", "Privacy", "Freedom", "Community"] };
const HUES = [205, 28, 150, 265, 95, 350, 45, 175];
const SANS = "Inter, system-ui, -apple-system, sans-serif";
const SEA_Y = 760;

// ---------- shared drawing ----------
function soft(x, y, r, c, a) {
  if (a <= 0.003) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(c, a));
  gr.addColorStop(0.4, rgba(c, a * 0.35));
  gr.addColorStop(1, rgba(c, 0));
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
}
function skyGrad(top, bot, y0 = 0, y1 = H) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, rgba(top)); gr.addColorStop(1, rgba(bot));
  g.fillStyle = gr; g.fillRect(-60, -60, W + 120, H + 120);
}
const STARS = (() => {
  const r = rng(11), out = [];
  for (let i = 0; i < 170; i++) out.push([r() * W, r() * H * 1.6 - H * 0.6, r() < 0.85 ? 1.5 : 2.5, r() * 6.28, r()]);
  return out;
})();
function stars(t, a, dy = 0, maxY = H) {
  if (a <= 0) return;
  for (const [x, y, r, ph, k] of STARS) {
    const yy = y + dy;
    if (yy < -5 || yy > maxY) continue;
    g.fillStyle = rgba(CREAM, a * (0.6 + 0.4 * Math.sin(t * (0.6 + k) + ph)) * (0.35 + 0.65 * k));
    g.beginPath(); g.arc(x, yy, r / 2 + 0.3, 0, 7); g.fill();
  }
}
function black(a) { if (a > 0) { g.fillStyle = `rgba(0,0,0,${a})`; g.fillRect(-60, -60, W + 120, H + 120); } }
function wash(a, c) { if (a > 0) { g.fillStyle = rgba(c, a); g.fillRect(-60, -60, W + 120, H + 120); } }
function poly(pts) { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); }
// Layered hills with soft atmospheric depth.
function ridge(seed, base, amp, color, w = W) {
  g.fillStyle = rgba(color);
  g.beginPath(); g.moveTo(-40, H + 400);
  for (let x = -40; x <= w + 40; x += 20) {
    g.lineTo(x, base - amp * (0.55 * Math.sin(x * 0.0024 + seed) + 0.3 * Math.sin(x * 0.0061 + seed * 2.3) + 0.15 * Math.sin(x * 0.013 + seed * 5)));
  }
  g.lineTo(w + 40, H + 400); g.fill();
}
function waterLines(t, y0, y1, c, a) {
  g.fillStyle = rgba(c, a);
  const r = rng(31);
  for (let i = 0; i < 44; i++) {
    const y = lerp(y0 + 10, y1, Math.pow(r(), 1.6));
    const len = 30 + r() * 120 * (y - y0) / (y1 - y0 + 1);
    const x = ((r() * W + t * (8 + r() * 10)) % (W + 200)) - 100;
    g.fillRect(x, y, len, 2);
  }
}

// Film grain, generated once, shifted every frame.
const GRAIN = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d"), img = x.createImageData(256, 256), r = rng(99);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = r() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
})();
function grain(t) {
  const f = Math.floor(t * 24), ox = (f * 73) % 256, oy = (f * 151) % 256;
  g.save();
  g.globalAlpha = 0.045; g.globalCompositeOperation = "overlay";
  g.translate(-ox, -oy);
  g.fillStyle = g.createPattern(GRAIN, "repeat");
  g.fillRect(0, 0, W + 256, H + 256);
  g.restore();
}
function vignette() {
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 1.0);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.45)");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ---------- the Hilal mark (two circles, as in branding/about-logo.svg) ----------
function logoPath(x, y, size) {
  const R = size / 2;
  g.beginPath();
  g.arc(x, y, R, 0, Math.PI * 2);
  g.moveTo(x + R * 0.1227 + R * 0.8203, y - R * 0.1057);
  g.arc(x + R * 0.1227, y - R * 0.1057, R * 0.8203, 0, Math.PI * 2, true);
}
function drawLogo(x, y, size, a = 1, color = HILAL, halo = 0.35) {
  if (a <= 0) return;
  const R = size / 2, gr = g.createRadialGradient(x, y, R * 0.98, x, y, R * 2.2);
  gr.addColorStop(0, rgba(color, halo * a)); gr.addColorStop(0.3, rgba(color, halo * a * 0.35)); gr.addColorStop(1, rgba(color, 0));
  g.save(); g.beginPath(); g.rect(x - R * 2.3, y - R * 2.3, R * 4.6, R * 4.6); g.moveTo(x + R * 0.98, y); g.arc(x, y, R * 0.98, 0, Math.PI * 2, true); g.clip("evenodd");
  g.fillStyle = gr; g.fillRect(x - R * 2.3, y - R * 2.3, R * 4.6, R * 4.6); g.restore();
  logoPath(x, y, size);
  g.fillStyle = rgba(color, a); g.fill("evenodd");
}
function ghostMoon(x, y, size, a) {
  if (a <= 0) return;
  // The part of the moon that is still dark: a faint disc and a dotted edge.
  const R = size / 2, cx = x + R * 0.1227, cy = y - R * 0.1057, r = R * 0.8203;
  g.save();
  g.fillStyle = rgba(HILAL, 0.1 * a); g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  g.strokeStyle = rgba(HILAL, 0.6 * a); g.lineWidth = 2.5;
  g.setLineDash([2, 12]); g.lineCap = "round";
  g.beginPath(); g.arc(cx, cy, r - 6, 0, Math.PI * 2); g.stroke();
  g.restore();
}

// ---------- value symbols: built from circles, like the mark ----------
function drawValue(k, x, y, s, a, color, lit = 1, reveal = 1) {
  if (a <= 0.005) return;
  const c = mixc(ASH, color, lit);
  g.save();
  g.translate(x, y); g.scale(s, s);
  g.globalAlpha *= a;
  g.strokeStyle = rgba(c); g.fillStyle = rgba(c);
  g.lineWidth = 6; g.lineCap = "round"; g.lineJoin = "round";
  const sweep = reveal;
  if (k === 0) {
    // An open ring.
    const gap = 0.55, s0 = -Math.PI / 4 + gap;
    g.beginPath(); g.arc(0, 0, 30, s0, s0 + (Math.PI * 2 - gap * 2) * sweep); g.stroke();
    if (reveal >= 1) { g.beginPath(); g.arc(Math.cos(-Math.PI / 4) * 44, Math.sin(-Math.PI / 4) * 44, 5, 0, 7); g.fill(); }
  } else if (k === 1) {
    // A disc with a keyhole cut out.
    g.globalAlpha *= reveal;
    g.beginPath(); g.arc(0, 0, 33, 0, 7);
    g.moveTo(9, -8); g.arc(0, -8, 9, 0, Math.PI * 2, true);
    g.moveTo(-5, -2); g.lineTo(-8, 18); g.lineTo(8, 18); g.lineTo(5, -2); g.closePath();
    g.fill("evenodd");
  } else if (k === 2) {
    // Two wings.
    g.beginPath(); g.arc(-18, 14, 22, Math.PI * 1.15, Math.PI * 1.15 + Math.PI * 0.75 * sweep); g.stroke();
    g.beginPath(); g.arc(18, 14, 22, Math.PI * 1.85 - Math.PI * 0.75 * sweep, Math.PI * 1.85); g.stroke();
  } else {
    // Three linked rings.
    for (const [px, py] of [[0, -12], [-13, 10], [13, 10]]) {
      g.beginPath(); g.arc(px, py, 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * sweep); g.stroke();
    }
  }
  g.restore();
}

// ---------- browser windows ----------
function drawWindow(x, y, s, hue, a, light = 1) {
  if (a <= 0.01) return;
  const fr = hslRgb(hue, 0.6, lerp(0.35, 0.7, light));
  soft(x, y, 120 * s, fr, 0.22 * light * a);
  g.save();
  g.translate(x, y); g.scale(s, s);
  g.globalAlpha *= a;
  g.fillStyle = rgba(mixc(fr, [10, 14, 30], 0.75));
  g.beginPath(); g.roundRect(-44, -32, 88, 64, 10); g.fill();
  g.fillStyle = rgba(fr);
  g.beginPath(); g.roundRect(-44, -32, 88, 16, [10, 10, 0, 0]); g.fill();
  g.fillStyle = rgba(mixc(fr, [10, 14, 30], 0.6));
  for (let d = 0; d < 3; d++) { g.beginPath(); g.arc(-33 + d * 10, -24, 2.6, 0, 7); g.fill(); }
  g.fillStyle = rgba(fr, 0.7);
  g.fillRect(-32, -6, 46, 5); g.fillRect(-32, 6, 60, 5); g.fillRect(-32, 18, 34, 5);
  g.restore();
}
function hslRgb(h, s, l) {
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}

// ---------- figures: robed silhouettes ----------
// Angles are absolute: 0 points down, PI points up, positive turns toward +x.
const dir = a => [Math.sin(a), Math.cos(a)];
const P = (lean, la, ra, ll, rl, crouch = 0) => ({ lean, la, ra, ll, rl, crouch });
const STAND = P(0, [-0.12, -0.06], [0.12, 0.06], [-0.08, 0], [0.08, 0]);
function poseLerp(a, b, x) {
  const o = {};
  for (const k in a) o[k] = Array.isArray(a[k]) ? a[k].map((v, i) => lerp(v, b[k][i], x)) : lerp(a[k], b[k], x);
  return o;
}
function poseAt(t, frames) {
  if (t <= frames[0][0]) return frames[0][1];
  for (let i = 1; i < frames.length; i++) {
    if (t <= frames[i][0]) return poseLerp(frames[i - 1][1], frames[i][1], eio(seg(t, frames[i - 1][0], frames[i][0])));
  }
  return frames[frames.length - 1][1];
}
function figure(x, y, s, p, opt = {}) {
  const fx = opt.flip ? -1 : 1;
  const hip = [0, -94 + p.crouch];
  const up = [Math.sin(p.lean), -Math.cos(p.lean)], side = [Math.cos(p.lean), Math.sin(p.lean)];
  const top = [hip[0] + up[0] * 66, hip[1] + up[1] * 66];
  const head = [top[0] + up[0] * 28, top[1] + up[1] * 28];
  const limb = (from, [a1, a2], l1, l2) => {
    const [x1, y1] = dir(a1), [x2, y2] = dir(a2);
    const m = [from[0] + x1 * l1, from[1] + y1 * l1];
    return [m, [m[0] + x2 * l2, m[1] + y2 * l2]];
  };
  const [lk, lf] = limb(hip, p.ll, 47, 47), [rk, rf] = limb(hip, p.rl, 47, 47);
  const sh = (k) => [top[0] + side[0] * 15 * k, top[1] + side[1] * 15 * k + 4];
  const [le, lh] = limb(sh(-1), p.la, 34, 32), [re, rh] = limb(sh(1), p.ra, 34, 32);
  const col = rgba(opt.color || SIL);
  g.save();
  g.translate(x, y); g.scale(s * fx, s);
  g.globalAlpha *= opt.alpha ?? 1;
  g.lineCap = "round"; g.lineJoin = "round";
  if (opt.sash) {
    const tt = opt.t || 0;
    const pt = u => [top[0] - 6 - u * 10, top[1] + 10 + u * 2 + Math.sin(tt * 6 - u * 0.6) * u * 1.6];
    g.strokeStyle = rgba(opt.sash);
    for (let i = 0; i < 11; i++) {
      g.lineWidth = 8 - i * 0.5;
      g.beginPath(); g.moveTo(...pt(i)); g.lineTo(...pt(i + 1)); g.stroke();
    }
  }
  g.strokeStyle = col; g.fillStyle = col;
  const stroke = (pts, w) => { g.lineWidth = w; g.beginPath(); pts.forEach((q, i) => (i ? g.lineTo(...q) : g.moveTo(...q))); g.stroke(); };
  stroke([hip, lk, lf], 12); stroke([hip, rk, rf], 12);
  // Robe: from the shoulders to a hem that follows the legs.
  const hemL = [hip[0] + Math.sin(p.ll[0]) * 40 - 8, hip[1] + Math.cos(p.ll[0]) * 40];
  const hemR = [hip[0] + Math.sin(p.rl[0]) * 40 + 8, hip[1] + Math.cos(p.rl[0]) * 40];
  const sL = sh(-1.15), sR = sh(1.15);
  g.beginPath(); g.moveTo(...sL);
  g.quadraticCurveTo(hip[0] - side[0] * 20, hip[1] - side[1] * 20, ...hemL);
  g.quadraticCurveTo((hemL[0] + hemR[0]) / 2, Math.max(hemL[1], hemR[1]) + 6, ...hemR);
  g.quadraticCurveTo(hip[0] + side[0] * 20, hip[1] + side[1] * 20, ...sR);
  g.closePath(); g.fill();
  stroke([sh(-1), le, lh], 11); stroke([sh(1), re, rh], 11);
  g.beginPath(); g.arc(head[0], head[1], 16, 0, 7); g.fill();
  if (opt.rim) {
    g.strokeStyle = rgba(opt.rim, 0.55); g.lineWidth = 1.6;
    g.beginPath(); g.arc(head[0], head[1], 16, -Math.PI * 0.9, -Math.PI * 0.1); g.stroke();
  }
  if (opt.mark) {
    // The keeper wears the mark on their chest.
    const m = [top[0] + up[0] * -18 + side[0] * 2, top[1] + up[1] * -18];
    logoPath(m[0], m[1], 12);
    g.fillStyle = rgba(opt.mark); g.fill("evenodd");
  }
  g.restore();
  const w = ([px, py]) => [x + px * s * fx, y + py * s];
  return { lh: w(lh), rh: w(rh), head: w(head), top: w(top) };
}
function bird(x, y, size, flap, c, a) {
  if (a <= 0) return;
  g.strokeStyle = rgba(c, a); g.lineWidth = Math.max(2, size * 0.18); g.lineCap = "round";
  g.beginPath();
  g.moveTo(x - size, y - flap * size * 0.5);
  g.quadraticCurveTo(x - size * 0.45, y - size * 0.25, x, y);
  g.quadraticCurveTo(x + size * 0.45, y - size * 0.25, x + size, y - flap * size * 0.5);
  g.stroke();
}

// ---------- the Fox ----------
const FOX_BODY = new Path2D("M146 -191 Q116 -206 98 -216 L94 -264 L78 -226 L64 -258 L56 -216 C40 -200 30 -180 28 -160 C20 -120 -30 -90 -30 -40 C-30 -14 -10 0 20 0 L112 0 C116 -4 112 -10 100 -12 C98 -60 92 -100 96 -130 C100 -150 110 -168 120 -178 C128 -184 140 -186 146 -191 Z");
const FOX_TAIL = new Path2D("M-24 -52 C-118 -76 -138 4 -72 12 C-24 20 72 16 118 4 C68 -10 6 -8 -24 -52 Z");
const FOX_TIP = new Path2D("M72 12 C90 10 106 7 118 4 C106 -2 90 -4 72 -3 Z");
const FOX_BIB = new Path2D("M120 -178 C108 -168 100 -148 100 -118 C110 -136 122 -158 134 -186 Z");
const FOX_EAR = new Path2D("M91 -250 L83 -228 L94 -222 Z");
const FOX_DOTS = (() => {
  const r = rng(77), out = [], c = document.createElement("canvas").getContext("2d");
  while (out.length < 240) {
    const x = -140 + r() * 290, y = -264 + r() * 284;
    if (c.isPointInPath(FOX_BODY, x, y) || c.isPointInPath(FOX_TAIL, x, y)) out.push([x, y, r(), r()]);
  }
  return out;
})();
function drawFox(x, y, s, a, color, eyes = 0) {
  if (a <= 0.005) return;
  g.save();
  g.translate(x, y); g.scale(s, s); g.translate(-10, 0);
  g.globalAlpha *= a;

      g.strokeStyle = "rgba(255,246,220,0.95)"; g.lineWidth = 3; g.lineCap = "round";
      for (const [x0, y0, x1, y1, t0, t1] of CRACKS) {
        const p = seg(ct, t0 * 2.4, t1 * 2.4);
        if (p <= 0) continue;
        g.beginPath(); g.moveTo(x0, y0); g.lineTo(lerp(x0, x1, p), lerp(y0, y1, p)); g.stroke();
      }
    }
    g.restore();
    g.restore();
  }
  if (flare > 0) {
    g.strokeStyle = rgba(AMBER, 0.45 * (1 - seg(t, C.code, C.code + 1.4))); g.lineWidth = 2.5;
    g.beginPath(); g.arc(ICE_X + EMBER_AT[0], ICE_Y + EMBER_AT[1], Math.max(1, (t - C.code) * 760), 0, 7); g.stroke();
  }
  const bx = lerp(-340, ICE_X - 500, eo(seg(t, C.found - 0.3, C.frozen + 0.8)));
  if (bx > -320) drawBoat(t, bx, SEA_Y + 72 + Math.sin(t * 1.5) * 4, C.crack);
  if (burst > 0 && burst < 1) {
    for (const [x, y, vx, vy, sp] of SHARDS) {
      g.save(); g.translate(ICE_X + x + vx * burst, ICE_Y + y + vy * burst + 400 * burst * burst); g.rotate(sp * burst * 4);
      g.fillStyle = rgba(HILAL, 1 - burst); poly([[0, -14], [9, 8], [-9, 6]]); g.fill();
      g.restore();
    }
  }
  g.restore();
  // The beam.
  const beam = env(t, C.beam - 0.05, C.hilal + 0.5, 0.15, 0.7);
  const bx2 = ICE_X + EMBER_AT[0] * push, by2 = ICE_Y + EMBER_AT[1] * push;
  if (beam > 0) {
    const top = -tilt - 400;
    const gr = g.createLinearGradient(bx2 - 80, 0, bx2 + 80, 0);
    gr.addColorStop(0, rgba(HILAL, 0)); gr.addColorStop(0.5, rgba([236, 246, 255], 0.95 * beam)); gr.addColorStop(1, rgba(HILAL, 0));
    g.fillStyle = gr; g.fillRect(bx2 - 80, top, 160, by2 - top);
    soft(bx2, by2, 260, HILAL, 0.6 * beam);
    wash(0.5 * (1 - seg(t, C.beam, C.beam + 0.5)) * seg(t, C.beam - 0.05, C.beam), [236, 246, 255]);
  }
  g.restore();
  // The new light in the sky, in screen space after the tilt.
  const mx = bx2, my = 360;
  const gather = seg(t, C.sky - 0.6, C.hilal);
  if (gather > 0 && t < C.hilal + 0.2) soft(mx, my, 80 + 160 * gather, HILAL, 0.7 * gather * (1 - seg(t, C.hilal - 0.1, C.hilal + 0.2)));
  const born = eo(seg(t, C.hilal - 0.1, C.hilal + 0.4));
  if (born > 0) {
    drawLogo(mx, my, lerp(220, 300, born), born, HILAL, 0.35 + 0.4 * env(t, C.hilal - 0.1, C.hilal + 2.2, 0.1, 2.0));
    wash(0.4 * (1 - seg(t, C.hilal, C.hilal + 0.7)) * born, [236, 246, 255]);
    g.save();
    g.font = `600 112px ${SANS}`; g.textAlign = "center";
    g.fillStyle = rgba(CREAM, seg(t, C.hilal + 0.2, C.hilal + 0.9));
    g.fillText("Hilal", mx, my + 310);
    g.restore();
  }
}

// ======================================================================
// Scene 7: still learning
// ======================================================================
function sLearn(t) {
  const pan = kf(t, [[C.notyet - 0.3, 0], [C.notyet + 1.4, 1]]);
  skyGrad(NIGHT0, NIGHT2);
  const mx = 1380, my = 270;
  g.save();
  g.translate(0, pan * 560);
  stars(t, 0.9, -300, SEA_Y);
  drawLogo(mx, my - pan * 440, 300, 1);
  ghostMoon(mx, my - pan * 440, 300, env(t, C.notyet - 0.1, C.believe + 1, 0.8, 0.6));
  ridge(5, SEA_Y - 30, 30, [24, 36, 76]);
  const sea = g.createLinearGradient(0, SEA_Y, 0, H + 400);
  sea.addColorStop(0, rgba([18, 32, 70])); sea.addColorStop(1, rgba([4, 8, 20]));
  g.fillStyle = sea; g.fillRect(-50, SEA_Y, W + 100, H + 600);
  for (let i = 0; i < 8; i++) {
    g.fillStyle = rgba(HILAL, 0.3 - i * 0.03);
    g.fillRect(mx - 70 + Math.sin(t * 1.6 + i) * 18, SEA_Y + 16 + i * 26, 140 - i * 10, 3);
  }
  g.fillStyle = rgba(SIL);
  g.beginPath(); g.moveTo(-50, H + 600); g.lineTo(-50, 830); g.quadraticCurveTo(400, 800, 660, 850); g.quadraticCurveTo(900, 880, 1180, H + 600); g.fill();
  // The young keeper tries the move and fumbles it.
  const e = t - C.learn;
  const pose = poseAt(e, [[0, STAND], [0.4, P(0.28, [-0.4, -0.2], [-0.1, 0], [-0.55, 0.2], [0.55, -0.1], 24)],
    [0.75, P(-0.08, [2.8, 3.0], [3.4, 3.3], [-0.1, 0], [0.18, 0], 0)],
    [1.3, P(-0.22, [-1.0, -0.5], [1.2, 0.7], [-0.3, 0], [0.4, 0.2], 6)],
    [2.0, P(0.04, [-0.15, -0.08], [2.4, -2.3], [-0.1, 0], [0.1, 0], 0)]]);
  const f = figure(700, 848, 1.5, pose, { sash: HILAL, t, mark: HILAL, rim: HILAL });
  const age = e - 0.7;
  if (age > 0) {
    const hx = (f.lh[0] + f.rh[0]) / 2, hy = (f.lh[1] + f.rh[1]) / 2;
    soft(hx, hy, 70, VCOL[2], 0.5 * (1 - seg(age, 0, 0.6)));
    bird(hx + age * 260, hy - age * 300, 14, Math.sin(t * 14), VCOL[2], 1 - seg(age, 1.2, 1.8));
    const fy = Math.min(hy + 150, hy - 60 * age + 300 * age * age);
    bird(hx - 20 + age * 40, fy, 11, Math.sin(t * 20) * (1 - seg(age, 0.5, 0.9)), VCOL[2], 1 - seg(age, 1.0, 1.6));
  }
  g.restore();
}

// ======================================================================
// Scene 8: belief, and the end card
// ======================================================================
function sBelieve(t) {
  const dawn = seg(t, C.believe, C.end + 1);
  skyGrad(mixc(NIGHT0, [16, 26, 66], dawn), mixc(NIGHT2, [206, 150, 132], dawn));
  stars(t, 0.8 * (1 - dawn * 0.7), -200, SEA_Y);
  const mx = 1300, my = lerp(420, 340, eo(seg(t, C.believe - 0.3, C.believe + 2)));
  drawLogo(mx, my, 330, 1, HILAL, 0.35 + 0.25 * env(t, C.return[3], C.return[3] + 2, 0.2, 1.5));
  for (let k = 0; k < 4; k++) {
    const r = C.return[k], a = eo(seg(t, r, r + 0.8));
    if (a <= 0) continue;
    const an = -Math.PI / 2 + k * Math.PI / 2 + (t - r) * 0.22;
    const x = mx + Math.cos(an) * 300, y = my + Math.sin(an) * 210;
    soft(x, y, 90, VCOL[k], 0.5 * (1 - seg(t, r, r + 0.8)));
    drawValue(k, x, y, 0.75, a, VCOL[k]);
  }
  ridge(6, SEA_Y - 26, 26, mixc([24, 36, 76], [90, 70, 90], dawn));
  const sea = g.createLinearGradient(0, SEA_Y, 0, H);
  sea.addColorStop(0, rgba(mixc([18, 32, 70], [120, 96, 110], dawn))); sea.addColorStop(1, rgba([6, 10, 24]));
  g.fillStyle = sea; g.fillRect(-50, SEA_Y, W + 100, H);
  waterLines(t, SEA_Y, H, mixc(HILAL, [255, 214, 180], dawn), 0.14);
  g.save();
  g.translate(W / 2, SEA_Y); g.scale(0.5, 0.5); g.translate(-W / 2, -SEA_Y);
  drawIsles(t, -500, { land: [10, 16, 38], mark: [20, 30, 64], bridges: seg(t, C.return[2], C.return[3] + 1) });
  ISLES.forEach((s, i) => {
    const at = C.return[0] + 0.6 + i * 0.18;
    drawWindow(s.x - 500, isleTop(i) - 170 + Math.sin(t * 1.2 + i) * 6, 1.1, HUES[i], eo(seg(t, at, at + 0.6)));
  });
  g.restore();
  g.fillStyle = rgba(SIL);
  g.beginPath(); g.moveTo(-50, H + 50); g.lineTo(-50, 650); g.quadraticCurveTo(380, 640, 560, 720); g.lineTo(640, H + 50); g.fill();
  const pose = poseAt(t - C.believe, [[0.3, STAND], [1.4, P(-0.05, [-0.15, -0.08], [2.3, 2.4], [-0.1, 0], [0.1, 0])]]);
  figure(440, 684, 2.0, pose, { sash: HILAL, t, mark: HILAL, rim: mixc(HILAL, [255, 200, 170], dawn) });
  const ec = seg(t, C.end + 0.6, C.end + 1.8);
  if (ec > 0) {
    g.fillStyle = rgba([4, 7, 15], ec); g.fillRect(-60, -60, W + 120, H + 120);
    drawLogo(W / 2, 400, 260, ec, HILAL, 0.3);
    const en = lang === "en";
    const n1 = "Hilal", n2 = en ? "Browser" : "Tarayıcı";
    g.save();
    g.font = `600 96px ${SANS}`; const w1 = g.measureText(n1).width;
    g.font = `300 96px ${SANS}`; const w2 = g.measureText(n2).width;
    const x0 = W / 2 - (w1 + 28 + w2) / 2;
    g.fillStyle = rgba(CREAM, ec);
    g.font = `600 96px ${SANS}`; g.fillText(n1, x0, 720);
    g.font = `300 96px ${SANS}`; g.fillText(n2, x0 + w1 + 28, 720);
    g.textAlign = "center";
    g.font = `400 32px ${SANS}`; g.fillStyle = rgba(CREAM, 0.7 * ec);
    g.fillText(en ? "Open source. Private. For everyone." : "Açık kaynak. Gizliliğe saygılı. Herkesin.", W / 2, 796);
    g.font = `400 26px ${SANS}`; g.fillStyle = rgba(HILAL, 0.9 * ec);
    g.fillText("github.com/VastSea0/hilal-browser", W / 2, 856);
    g.restore();
  }
}

// ======================================================================
// Scenes in order. Each fades in from the previous one at `a` over `fade`.
// ======================================================================
const SCENES = [
  { a: 0, fade: 0, draw: sValues },
  { a: C.harmony - 0.3, fade: 0.4, draw: sHarmony },
  { a: C.attack + 0.3, fade: 0, draw: sAttack },
  { a: C.fox - 0.5, fade: 0.7, draw: sFox },
  { a: C.years - 0.3, fade: 0.6, draw: sYears },
  { a: C.dark + 1.0, fade: 1.4, draw: sIce },
  { a: C.learn - 0.4, fade: 0.7, draw: sLearn },
  { a: C.believe - 0.4, fade: 0.8, draw: sBelieve },
];
const main = g;
const buf = document.createElement("canvas");
buf.width = W; buf.height = H;
const bufG = buf.getContext("2d");
function drawScene(s, t, alpha) {
  if (alpha >= 1) { g.save(); s.draw(t); g.restore(); return; }
  g = bufG;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  g.save(); s.draw(t); g.restore();
  g = main;
  g.save(); g.globalAlpha = alpha; g.drawImage(buf, 0, 0); g.restore();
}

// ---------- captions ----------
const CAPS = (() => {
  const all = TL.lines.flat();
  return all.map((u, i) => ({ start: u.start, end: Math.min(u.end + 0.6, all[i + 1] ? all[i + 1].start - 0.05 : 1e9), tr: u.tr, en: u.en }));
})();
function drawCaption(t) {
  if (lang === "off") return;
  const cap = CAPS.find(c => t >= c.start && t < c.end);
  if (!cap) return;
  const text = cap[lang === "en" ? "en" : "tr"];
  const a = Math.min(seg(t, cap.start, cap.start + 0.15), 1 - seg(t, cap.end - 0.2, cap.end));
  g.save();
  g.font = `500 40px ${SANS}`; g.textAlign = "center";
  const words = text.split(" "), lines = [];
  let cur = "";
  for (const w of words) {
    const next = cur ? cur + " " + w : w;
    if (g.measureText(next).width > 1380 && cur) { lines.push(cur); cur = w; } else cur = next;
  }
  lines.push(cur);
  // A soft dark band behind the text, no boxes.
  const band = g.createLinearGradient(0, H - 200, 0, H);
  band.addColorStop(0, "rgba(0,0,0,0)"); band.addColorStop(1, `rgba(0,0,0,${0.5 * a})`);
  g.fillStyle = band; g.fillRect(0, H - 200, W, 200);
  const lh = 54, base = H - 66 - (lines.length - 1) * lh;
  g.shadowColor = "rgba(0,0,0,0.8)"; g.shadowBlur = 10; g.shadowOffsetY = 2;
  g.fillStyle = rgba(CREAM, a);
  lines.forEach((l, i) => g.fillText(l, W / 2, base + i * lh));
  g.restore();
}

function render(t) {
  g = main;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  let cur = 0;
  for (let i = 0; i < SCENES.length; i++) if (t >= SCENES[i].a) cur = i;
  const s = SCENES[cur];
  const x = s.fade ? seg(t, s.a, s.a + s.fade) : 1;
  if (x < 1 && cur > 0) drawScene(SCENES[cur - 1], t, 1);
  drawScene(s, t, x);
  vignette();
  grain(t);
  black(Math.max(1 - seg(t, 0, 0.8), seg(t, TL.duration - 1.4, TL.duration)));
  drawCaption(t);
}
window.renderAt = render;
window.STORY_DURATION = TL.duration;

// ---------- player ----------
const audio = document.getElementById("audio");
const stage = document.getElementById("stage");
const start = document.getElementById("start");
const pp = document.getElementById("pp"), ppi = document.getElementById("ppi");
const seek = document.getElementById("seek"), time = document.getElementById("time");
const cc = document.getElementById("cc"), fs = document.getElementById("fs");
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const LANG_LABEL = { tr: "TR", en: "EN", off: "ALTYAZI YOK" };
let seeking = false;
function setPaused(p) {
  stage.classList.toggle("paused", p);
  ppi.setAttribute("d", p ? "M7 5l12 7-12 7z" : "M6 5h4v14H6zM14 5h4v14h-4z");
  pp.setAttribute("aria-label", p ? "Oynat" : "Duraklat");
}
function loop() {
  const t = audio.currentTime;
  render(t);
  if (!seeking) seek.value = String(Math.round((t / TL.duration) * 1000));
  time.textContent = fmt(t);
  requestAnimationFrame(loop);
}
start.addEventListener("click", () => { start.hidden = true; audio.currentTime = 0; audio.play(); });
pp.addEventListener("click", () => (audio.paused ? audio.play() : audio.pause()));
audio.addEventListener("play", () => setPaused(false));
audio.addEventListener("pause", () => setPaused(true));
audio.addEventListener("ended", () => setPaused(true));
seek.addEventListener("input", () => { seeking = true; audio.currentTime = (seek.value / 1000) * TL.duration; });
seek.addEventListener("change", () => { seeking = false; });
cc.addEventListener("click", () => { lang = { tr: "en", en: "off", off: "tr" }[lang]; cc.textContent = LANG_LABEL[lang]; });
fs.addEventListener("click", () => (document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen()));
document.addEventListener("keydown", e => { if (e.code === "Space" && start.hidden) { e.preventDefault(); pp.click(); } });
cc.textContent = LANG_LABEL[lang];
if (params.has("export")) {
  document.body.classList.add("export");
  render(0);
} else {
  if (params.has("t")) audio.currentTime = Number(params.get("t"));
  requestAnimationFrame(loop);
}
</script>

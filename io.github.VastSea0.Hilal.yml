app-id: io.github.VastSea0.Hilal
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.mozilla.firefox.BaseApp
base-version: '25.08'
command: hilal

# Repackages the Linux release tarball that CI built and UI-tested, the way
# Zen and Firefox are published on Flathub. Flathub hosts and updates it for
# free; the browser's own updater is turned off inside the Flatpak.

finish-args:
  - --allow=devel
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pcsc
  - --socket=cups
  - --device=all
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-run/speech-dispatcher:ro
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --talk-name=org.a11y.Bus
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.gtk.vfs.*
  - --system-talk-name=org.freedesktop.NetworkManager
  - --own-name=io.github.VastSea0.Hilal.*
  - --own-name=org.mpris.MediaPlayer2.firefox.*
  - --persist=.mozilla
  - --env=DICPATH=/usr/share/hunspell

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/man

modules:
  - name: hilal-browser
    buildsystem: simple
    build-commands:
      - mkdir -p "$FLATPAK_DEST/lib"
      - mv firefox "$FLATPAK_DEST/lib/hilal"
      # Keep Hilal's policies (uBlock, langpacks) and only switch off the
      # built-in updater; Flathub delivers updates.
      - >-
        python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p));
        d.setdefault('policies', {})['DisableAppUpdate']=True;
        d['policies'].pop('AppUpdateURL', None); json.dump(d, open(p,'w'), indent=2)"
        "$FLATPAK_DEST/lib/hilal/distribution/policies.json"
      - install -Dm755 hilal-browser/flatpak/hilal "$FLATPAK_DEST/bin/hilal"
      - install -Dm644 hilal-browser/flatpak/io.github.VastSea0.Hilal.desktop "$FLATPAK_DEST/share/applications/io.github.VastSea0.Hilal.desktop"
      - install -Dm644 hilal-browser/flatpak/io.github.VastSea0.Hilal.metainfo.xml "$FLATPAK_DEST/share/metainfo/io.github.VastSea0.Hilal.metainfo.xml"
      - install -Dm644 hilal-browser/LICENSE "$FLATPAK_DEST/share/licenses/io.github.VastSea0.Hilal/LICENSE"
      - for size in 16 32 48 64 128 256; do install -Dm644 "hilal-browser/changes/browser/branding/hilal/default$size.png" "$FLATPAK_DEST/share/icons/hicolor/${size}x${size}/apps/io.github.VastSea0.Hilal.png"; done
    sources:
      # HILAL_ARCHIVE_BEGIN
      - type: archive
        url: https://github.com/VastSea0/hilal-browser/releases/download/v0.4.0-alpha.3/Hilal-0.4.0-alpha.3-linux-x86_64.tar.xz
        sha256: a495c67683ffe991701cf4bd5d1f776d474ce1b6b8952e73b24c9aea97608098
        strip-components: 0
        only-arches:
          - x86_64
        # Flathub's external data checker opens an update pull request in the
        # Flathub repo for every new release. /releases/latest skips the
        # nightly pre-release.
        x-checker-data:
          type: json
          url: https://api.github.com/repos/VastSea0/hilal-browser/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("-linux-x86_64\\.tar\\.xz$")) | .browser_download_url
          is-main-source: true
      # HILAL_ARCHIVE_END
      # HILAL_SOURCE_BEGIN
      - type: git
        url: https://github.com/VastSea0/hilal-browser.git
        tag: v0.4.0-alpha.3
        dest: hilal-browser
      # HILAL_SOURCE_END
